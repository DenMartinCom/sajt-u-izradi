<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slajder Slika (Touch + Dugmići)</title>
    <style>
        /* Osnovni reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kontejner */
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        /* --- SLAJDER WRAPPER --- */
        .slider-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; 
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            user-select: none; /* Sprečava selektovanje slike tokom prevlačenja */
        }

        .slider-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preporučujem 'cover' umesto 'fill' za bolje izgledanje */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            cursor: pointer;
        }

        .slider-wrapper img.active {
            opacity: 1;
            z-index: 1;
        }

        /* Dugmići za navigaciju (Prethodna/Sledeća) */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .nav-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* Tačkice */
        .dots-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        .dot.active {
            background-color: #3498db;
            transform: scale(1.2);
        }

        .dot:hover {
            background-color: #95a5a6;
        }

        /* Kontakt dugme */
        .btn-kontakt {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .btn-kontakt:hover {
            background-color: #2980b9;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox.active {
            display: flex;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.1rem; }
            .nav-btn { padding: 8px 12px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Galerija</h1>
        
        <div class="slider-wrapper" id="sliderWrapper">
            <!-- Navigacioni dugmići -->
            <button class="nav-btn prev-btn" title="Prethodna">&lt;</button>
            <button class="nav-btn next-btn" title="Sledeća">&gt;</button>

            <!-- Slike -->
            <img src="zaSlajd/slika0.webp" alt="Slika 0" class="active">
            <img src="zaSlajd/slika1.webp" alt="Slika 1">
            <img src="zaSlajd/slika2.webp" alt="Slika 2">
            <img src="zaSlajd/slika3.webp" alt="Slika 3">
            <img src="zaSlajd/slika4.webp" alt="Slika 4">
            <img src="zaSlajd/slika5.webp" alt="Slika 5">
            <img src="zaSlajd/slika6.webp" alt="Slika 6">
        </div>

        <div class="dots-container" id="dotsContainer"></div>

        <a href="kontakt.html" class="btn-kontakt">Kontakt</a>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="Uvećana slika" id="lightboxImg">
    </div>

    <script>
        const DELAY = 5000;

        const wrapper = document.getElementById('sliderWrapper');
        const dotsBox = document.getElementById('dotsContainer');
        const slides = wrapper.querySelectorAll('img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const prevBtn = wrapper.querySelector('.prev-btn');
        const nextBtn = wrapper.querySelector('.next-btn');
        
        let current = 0;
        let interval = null;
        
        // Promenljive za Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        const minSwipeDistance = 50; // Minimalna distanca za swipe

        if (slides.length === 0) {
            console.error("Nije pronađena nijedna slika!");
            wrapper.style.display = 'none';
        } else {
            const dots = [];
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.onclick = () => showSlide(i);
                dotsBox.appendChild(dot);
                dots.push(dot);
            });

            function showSlide(index) {
                slides[current].classList.remove('active');
                dots[current].classList.remove('active');
                current = index;
                slides[current].classList.add('active');
                dots[current].classList.add('active');
            }

            function nextSlide() {
                showSlide((current + 1) % slides.length);
            }

            function prevSlide() {
                showSlide((current - 1 + slides.length) % slides.length);
            }

            function startTimer() {
                interval = setInterval(nextSlide, DELAY);
            }

            function stopTimer() {
                clearInterval(interval);
            }

            // --- KLIK NA SLIKU (Lightbox) ---
            slides.forEach((slide) => {
                slide.addEventListener('click', (e) => {
                    // Sprečiti da se aktivira ako je klik nastao preko dugmića
                    if(e.target === slide) {
                        lightboxImg.src = slide.src;
                        lightbox.classList.add('active');
                        stopTimer();
                    }
                });
            });

            // Zatvaranje Lightbox-a
            lightbox.addEventListener('click', () => {
                lightbox.classList.remove('active');
                lightboxImg.src = '';
                startTimer();
            });

            // --- DUGMIĆI ZA NAVIGACIJU ---
            prevBtn.addEventListener('click', () => {
                prevSlide();
                startTimer(); // Restartuj timer nakon interakcije
            });

            nextBtn.addEventListener('click', () => {
                nextSlide();
                startTimer();
            });

            // --- TOUCH SWIPE LOGIKA ---
            wrapper.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                stopTimer(); // Zaustavi slajdovanje dok korisnik dodiruje ekran
            }, { passive: true });

            wrapper.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
                startTimer(); // Nastavi slajdovanje nakon dodira
            }, { passive: true });

            function handleSwipe() {
                const diff = touchEndX - touchStartX;
                
                // Ako je swipe dovoljno dug
                if (Math.abs(diff) > minSwipeDistance) {
                    if (diff > 0) {
                        // Swipe levo (slika se pomera u levo -> sledeća slika)
                        nextSlide();
                    } else {
                        // Swipe desno (slika se pomera u desno -> prethodna slika)
                        prevSlide();
                    }
                }
            }

            // Pokreni slajdovanje
            startTimer();
        }
    </script>

</body>
</html>
