<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slajder Slika</title>
    <style>
        /* Osnovni reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kontejner */
        .container {
            width: 100%;
            max-width: 800px; /* Maksimalna širina slajdera */
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* --- STILOVI SLAJDERA --- */
        .slider-wrapper {
            position: relative;
            width: 100%;
            /* Aspect ratio 16:9, ali možeš promeniti na 4:3 ili 1:1 */
            aspect-ratio: 16 / 9; 
            background-color: #e0e0e0; /* Boja dok se slika učitava */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .slider-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Slika će pokriti ceo okvir */
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        .slider-wrapper img.active {
            opacity: 1;
            z-index: 1;
        }

        /* Tačkice */
        .dots-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        .dot.active {
            background-color: #3498db;
            transform: scale(1.2);
        }

        .dot:hover {
            background-color: #95a5a6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .slider-wrapper {
                /* Na mobilnom možda želiš da slika bude manja */
                max-height: 300px; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Naša Galerija</h1>
        
        <!-- SLAJDER -->
        <div class="slider-wrapper" id="sliderWrapper">
            
            <!-- UBACI SLIKE OVDE -->
            <!-- Zameni 'slika1.webp', 'slika2.webp' sa tvojim tačnim imenima fajlova -->
            <!-- Prva slika mora imati klasu 'active' -->
            
            <img src="zaSlajd/slika1.webp" alt="Slika 1" class="active">
            <img src="zaSlajd/slika2.webp" alt="Slika 2">
            <img src="zaSlajd/slika3.webp" alt="Slika 3">
            
            <!-- Ako imaš više slika, kopiraj linije iznad, npr:
            <img src="zaSlajd/slika4.webp" alt="Slika 4">
            <img src="zaSlajd/slika5.webp" alt="Slika 5">
             -->

        </div>

        <div class="dots-container" id="dotsContainer">
            <!-- Tačkice se automatski generišu -->
        </div>
    </div>

    <script>
        // Konfiguracija
        const DELAY = 5000; // 5 sekundi

        // Elementi
        const wrapper = document.getElementById('sliderWrapper');
        const dotsBox = document.getElementById('dotsContainer');
        const slides = wrapper.querySelectorAll('img');
        
        // Ako nema slika, izlazimo
        if (slides.length === 0) {
            console.error("Nije pronađena nijedna slika!");
            document.getElementById('sliderWrapper').style.display = 'none';
        } else {
            // Generiši tačkice
            const dots = [];
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.onclick = () => showSlide(i);
                dotsBox.appendChild(dot);
                dots.push(dot);
            });

            let current = 0;
            let interval = null;

            function showSlide(index) {
                // Skini active sa trenutne
                slides[current].classList.remove('active');
                dots[current].classList.remove('active');

                // Postavi novu
                current = index;
                slides[current].classList.add('active');
                dots[current].classList.add('active');

                // Resetuj tajmer
                resetTimer();
            }

            function nextSlide() {
                const nextIndex = (current + 1) % slides.length;
                showSlide(nextIndex);
            }

            function resetTimer() {
                clearInterval(interval);
                interval = setInterval(nextSlide, DELAY);
            }

            // Pokreni
            resetTimer();
        }
    </script>

</body>
</html>
