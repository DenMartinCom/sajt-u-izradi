<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provera mapa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  header, .infoBar, footer {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: #161a22;
    border-bottom: 1px solid #222;
    font-size: 13px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .tabovi { display: flex; gap: 4px; }
  .tab {
    background: transparent;
    color: #8892a6;
    border: 1px solid #2a3140;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .tab.aktivan {
    background: #2a3140;
    color: #e6e6e6;
    border-color: #3a4250;
  }
  .tab.aktivan.cg { color: #8ce99a; border-color: #2f5d3a; }
  .tab.aktivan.cs { color: #6ea8fe; border-color: #2f4d80; }
  .kontrole { display: flex; gap: 6px; align-items: center; }
  .kontrole input {
    background: #2a3140; color: #e6e6e6;
    border: 1px solid #3a4250;
    padding: 6px 8px; border-radius: 6px;
    font-size: 12px;
    width: 140px;
    min-width: 0;
  }
  .kontrole input:focus { outline: none; border-color: #5a6a80; }
  .kontrole button {
    background: #2f5d3a; color: #fff;
    border: none; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .kontrole button:disabled { opacity: 0.5; }
  .f24 {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: #8892a6;
    cursor: pointer;
  }
  .f24 input { accent-color: #f5c542; }
  .infoBar {
    font-size: 11px;
    color: #8892a6;
    padding: 4px 12px;
  }
  .pauza-badge {
    display: none;
    font-size: 11px;
    color: #d9534f;
    font-weight: 600;
    padding: 2px 6px;
    border: 1px solid #5a2a2a;
    border-radius: 4px;
  }
  .pauza-badge.aktivna { display: inline-block; }
  footer {
    border-bottom: none;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sredina-levo, .sredina-desno {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  footer button {
    background: #2a3140; color: #e6e6e6; border: none;
    padding: 8px 14px; border-radius: 6px; font-size: 14px;
    min-width: 44px;
  }
  footer button:disabled { opacity: 0.3; }
  #gen { background: #2f5d3a; padding: 8px 16px; font-weight: 600; }
  #reset { background: transparent; color: #7a8496; border: 1px solid #2a3140; padding: 6px 10px; font-size: 12px; min-width: 32px; }
  #nologo { background: transparent; color: #7a8496; border: 1px solid #2a3140; padding: 6px 10px; font-size: 12px; min-width: 32px; }
  #pusti-kes { background: transparent; color: #d9534f; border: 1px solid #5a2a2a; padding: 6px 10px; font-size: 12px; min-width: 32px; }
  #pusti-kes.aktivna { background: #5a2a2a; color: #fff; }
  .zaglavlje {
    display: grid; grid-template-columns: 28px 1fr 1fr; gap: 4px;
    padding: 4px 6px 2px;
    font-size: 11px; color: #8892a6;
    text-align: center; text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #161a22;
  }
  #lista {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .red {
    display: grid;
    grid-template-columns: 28px 1fr 1fr;
    gap: 4px;
    padding: 4px 6px;
    border-bottom: 1px solid #1a1f28;
    align-items: center;
    border-left: 3px solid transparent;
  }
  .red.mark-recent { border-left-color: #f5c542; }
  .red.mark-staro  { border-left-color: #4a5260; }
  .red.red-upari {
    background: rgba(217, 83, 79, 0.08);
    border-left-color: #d9534f;
  }
  .red.red-novi {
    background: rgba(245, 197, 66, 0.05);
    border-left-color: #f5c542;
  }
  .cek { display: flex; align-items: center; justify-content: center; }
  .cek input {
    width: 20px; height: 20px;
    accent-color: #6ea8fe;
    cursor: pointer;
  }
  .kartica {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 4px;
    background: #1a1f28; border-radius: 6px;
    min-height: 0; overflow: hidden;
  }
  .kartica.prazno { opacity: 0.35; }
  .kartica .ime {
    font-size: 11px; color: #b8c0cc;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%; line-height: 1.3;
  }
  .kartica .ime a { color: inherit; text-decoration: none; }
  .kartica .ime a:hover { text-decoration: underline; color: #6ea8fe; }
  .kartica.cg .ime a:hover { color: #8ce99a; }
  .kartica.cs .ime a:hover { color: #6ea8fe; }
  .kartica .logo {
    width: 28px; height: 28px; margin: 2px 0;
    object-fit: contain;
  }
  .kartica .simbol {
    font-size: 11px; font-weight: 600;
    color: #6ea8fe; line-height: 1.3;
  }
  .kartica.cg .simbol { color: #8ce99a; }
  .kartica.cs .simbol { color: #6ea8fe; }
</style>
</head>
<body>
  <header>
    <div class="tabovi">
      <button id="tab-cg" class="tab aktivan cg" data-tab="cg">CG</button>
      <button id="tab-cs" class="tab" data-tab="cs">CS</button>
    </div>
    <span id="pauza-badge" class="pauza-badge" title="Keš ciklus pauziran">⏸ PAUZA</span>
    <div class="kontrole">
      <input type="text" id="slug-input" placeholder="slug ili CMC link" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button id="go-btn">Go</button>
    </div>
  </header>
  <div class="infoBar"><span id="info">Učitavanje...</span></div>
  <div class="zaglavlje"><div></div><div>CMC</div><div id="desnoZaglavlje">CG</div></div>
  <div id="lista"></div>
  <footer>
    <div class="sredina-levo">
      <button id="pusti-kes" title="Pusti keš — odpauziraj (K)">K</button>
      <button id="pre">←</button>
      <span id="strana">— / —</span>
    </div>
    <div class="sredina-desno">
      <button id="reset" title="Očisti selekciju">R</button>
      <button id="nologo" title="Bez logotipa">L</button>
      <button id="gen">Generiši</button>
      <button id="sle">→</button>
    </div>
  </footer>
  <script src="js/provera.js"></script>
</body>
</html>
