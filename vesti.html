<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #eef1f6;
            padding: 16px 10px;
            min-height: 100vh;
        }

        /* JEDNA KOLONA – puna širina ekrana */
        .kolona {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .widget {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .widget iframe {
            display: block;
            border: none;
            border-radius: 10px;
            background: transparent;
        }

        /* VREME – 300x180, centrirano */
        .widget-vreme iframe {
            width: 300px;
            max-width: 100%;
            height: 180px;
        }

        /* EKONOMIJA – rastegni na punu širinu widgeta */
        .widget-ekonomija {
            padding: 0;
            background: transparent;
            box-shadow: none;
        }

        .widget-ekonomija iframe {
            width: 100%;
            max-width: 100%;
            height: 1150px; /* povećano ~15% sa 934px */
            border-radius: 14px;
            background: #F5F5F5;
        }

        /* KURSNA LISTA – uska, centrirana, bez praznog dna */
        .widget-kurs {
            justify-content: center; /* vertikalno centriranje iframe-a */
            padding: 12px;
        }

        .widget-kurs iframe {
            width: 115px;
            height: 135px;
        }

        /* KRIPTO */
        .widget-kripto {
            gap: 10px;
            align-items: stretch;
        }

        .widget-kripto .coinmarketcap-currency-widget {
            margin: 0 !important;
            width: 100% !important;
        }

        /* RESPONSIVE – na uskim ekranima sve ostaje u jednoj koloni */
        @media (max-width: 730px) {
            body {
                padding: 10px 8px;
            }

            .kolona {
                max-width: 100%;
                gap: 12px;
            }

            .widget {
                padding: 10px;
                border-radius: 12px;
            }

            .widget-ekonomija iframe {
                height: 980px; /* povećano ~15% sa 800px */
                border-radius: 12px;
            }

            .widget-vreme iframe {
                width: 100%;
                max-width: 340px;
                height: 170px;
            }
        }

        @media (max-width: 370px) {
            .widget-ekonomija iframe {
                height: 860px; /* povećano ~15% sa 700px */
            }
        }
    </style>
</head>
<body>

    <div class="kolona">

        <!-- VREME BEOGRAD -->
        <div class="widget widget-vreme">
            <iframe
                src="https://naslovi.net/vremenska-prognoza/widget/beograd?big=1"
                frameborder="0"
                scrolling="no"
                loading="lazy">
            </iframe>
        </div>

        <!-- VREME INĐIJA -->
        <div class="widget widget-vreme">
            <iframe
                src="https://naslovi.net/vremenska-prognoza/widget/indjija?big=1&bgcolor=FFFFFF&textcolor=000000"
                frameborder="0"
                scrolling="no"
                loading="lazy">
            </iframe>
        </div>

        <!-- EKONOMIJA – puna širina -->
        <div class="widget widget-ekonomija">
            <iframe
                src="https://naslovi.net/widget/?type=ekonomija&bgcolor=F5F5F5&textcolor=000000&separatorcolor=D0D0D0&count=10&"
                frameborder="0"
                scrolling="no"
                loading="lazy">
            </iframe>
        </div>

        <!-- KURSNA LISTA -->
        <div class="widget widget-kurs">
            <iframe
                id="iframe_vreme"
                src="https://naslovi.net/plugin/kursna_lista2.php?bgcolor=ffffff&color=000000"
                frameborder="0"
                height="175"
                scrolling="no"
                width="115"
                loading="lazy">
                <a href="https://naslovi.net/kursna_lista.php">Kursna lista</a>
            </iframe>
        </div>

        <!-- KRIPTO VALUTE -->
        <div class="widget widget-kripto">
            <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
            <div class="coinmarketcap-currency-widget" data-currencyid="30618" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="false" data-marketcap="false" data-volume="false" data-statsticker="false" data-stats="USD"></div>

            <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
            <div class="coinmarketcap-currency-widget" data-currencyid="5176" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="false" data-marketcap="false" data-volume="false" data-statsticker="false" data-stats="USD"></div>

            <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
            <div class="coinmarketcap-currency-widget" data-currencyid="39332" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="true" data-marketcap="true" data-volume="true" data-statsticker="true" data-stats="USD"></div>

            <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
            <div class="coinmarketcap-currency-widget" data-currencyid="1027" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="true" data-marketcap="true" data-volume="true" data-statsticker="true" data-stats="USD"></div>

            <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
            <div class="coinmarketcap-currency-widget" data-currencyid="1" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="true" data-marketcap="true" data-volume="true" data-statsticker="true" data-stats="USD"></div>
        </div>
    </div>
    <a>Izvori:</a>
    <a href="https://www.naslovi.net" target="_blank">Naslovi.net i </a>
    <a href="https://coinmarketcap.com" target="_blank">CoinmarketCap</a>
</body>
</html>
