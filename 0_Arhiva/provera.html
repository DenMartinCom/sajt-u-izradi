<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provera mapa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  header, .infoBar, footer {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: #161a22;
    border-bottom: 1px solid #222;
    font-size: 13px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .tabovi { display: flex; gap: 4px; }
  .tab {
    background: transparent;
    color: #8892a6;
    border: 1px solid #2a3140;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .tab.aktivan {
    background: #2a3140;
    color: #e6e6e6;
    border-color: #3a4250;
  }
  .tab.aktivan.cg { color: #8ce99a; border-color: #2f5d3a; }
  .tab.aktivan.cc { color: #6ea8fe; border-color: #2f4d80; }
  .kontrole { display: flex; gap: 6px; align-items: center; }
  .kontrole select {
    background: #2a3140; color: #e6e6e6;
    border: none; padding: 6px 8px; border-radius: 6px;
    font-size: 12px;
  }
  .f24 {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: #8892a6;
    cursor: pointer;
  }
  .f24 input { accent-color: #f5c542; }
  .infoBar {
    font-size: 11px;
    color: #8892a6;
    padding: 4px 12px;
  }
  footer {
    border-bottom: none;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  footer button {
    background: #2a3140; color: #e6e6e6; border: none;
    padding: 8px 14px; border-radius: 6px; font-size: 14px;
    min-width: 44px;
  }
  footer button:disabled { opacity: 0.3; }
  #gen { background: #2f5d3a; padding: 8px 16px; font-weight: 600; }
  #reset { background: transparent; color: #7a8496; border: 1px solid #2a3140; padding: 6px 10px; font-size: 12px; min-width: 32px; }
  #nologo { background: transparent; color: #7a8496; border: 1px solid #2a3140; padding: 6px 10px; font-size: 12px; min-width: 32px; }
  .sredina { display: flex; gap: 8px; align-items: center; }
  .zaglavlje {
    display: grid; grid-template-columns: 28px 1fr 1fr; gap: 4px;
    padding: 4px 6px 2px;
    font-size: 11px; color: #8892a6;
    text-align: center; text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #161a22;
  }
  #lista {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .red {
    display: grid;
    grid-template-columns: 28px 1fr 1fr;
    gap: 4px;
    padding: 4px 6px;
    border-bottom: 1px solid #1a1f28;
    align-items: center;
    border-left: 3px solid transparent;
  }
  .red.mark-recent { border-left-color: #f5c542; }
  .red.mark-staro  { border-left-color: #4a5260; }
  .cek { display: flex; align-items: center; justify-content: center; }
  .cek input {
    width: 20px; height: 20px;
    accent-color: #6ea8fe;
    cursor: pointer;
  }
  .kartica {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 4px;
    background: #1a1f28; border-radius: 6px;
    min-height: 0; overflow: hidden;
  }
  .kartica.prazno { opacity: 0.35; }
  .kartica .ime {
    font-size: 11px; color: #b8c0cc;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%; line-height: 1.3;
  }
  .kartica .ime a { color: inherit; text-decoration: none; }
  .kartica .ime a:hover { text-decoration: underline; color: #6ea8fe; }
  .kartica.cg .ime a:hover { color: #8ce99a; }
  .kartica.cc .ime a:hover { color: #6ea8fe; }
  .kartica .logo {
    width: 28px; height: 28px; margin: 2px 0;
    object-fit: contain;
  }
  .kartica .simbol {
    font-size: 11px; font-weight: 600;
    color: #6ea8fe; line-height: 1.3;
  }
  .kartica.cg .simbol { color: #8ce99a; }
  .kartica.cc .simbol { color: #6ea8fe; }
</style>
</head>
<body>
  <header>
    <div class="tabovi">
      <button id="tab-cg" class="tab aktivan cg" data-tab="cg">CG</button>
      <button id="tab-cc" class="tab" data-tab="cc">CC</button>
    </div>
    <div class="kontrole">
      <select id="sort" title="Sortiranje">
        <option value="nedavno">Nedavno menjani</option>
        <option value="podrazumevano">Podrazumevano</option>
        <option value="simbol">Simbol A-Ž</option>
      </select>
      <label class="f24" title="Samo menjani u poslednjih 24h">
        <input type="checkbox" id="filter24h">
        <span>24h</span>
      </label>
      <button id="reload">↻</button>
    </div>
  </header>
  <div class="infoBar"><span id="info">Učitavanje...</span></div>
  <div class="zaglavlje"><div></div><div>CMC</div><div id="desnoZaglavlje">CG</div></div>
  <div id="lista"></div>
  <footer>
    <button id="pre">←</button>
    <div class="sredina">
      <span id="strana">— / —</span>
      <button id="reset" title="Očisti selekciju">R</button>
      <button id="nologo" title="Bez logotipa">NL</button>
      <button id="gen">Generiši</button>
    </div>
    <button id="sle">→</button>
  </footer>
  <script src="js/provera.js"></script>
</body>
</html>
